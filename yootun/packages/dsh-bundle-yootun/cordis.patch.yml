# yootun 产品 bundle 的 patch 层：关闭官方品牌包、插入 yootun 品牌前端与
# 企业接入层、收口企业模型路由。本 bundle 在 profile bundles 列表中排在
# web-app 之后，patch 同 id 后层胜出：第一行覆盖 web-app 对 ui-brand-official
# 的 insert（官方品牌不加载）。
# managed MCP 的真实路由清单也收敛在本文件（分册 03 D 部分，见文末样例）。

- id: ui-brand-official
  disabled: true

# 企业模型路由（分册 03 B 部分，2026-11-14 协议定案 OpenAI Responses）：
# ixicai.cn 网关只服务 OpenAI 兼容协议（/v1/messages 不存在、
# /v1/chat/completions 真实 key 实测可对话），Anthropic 形态的 llm-deepseek
# 不适用（patch 收口撤除，恢复 base 官方默认；官方通道自配仍走官方默认
# 机制，决策点 10）。企业网关改经官方多协议适配器 llm-pi-ai 预置
# provider 路由（base bundle 已挂载 dormant，settings section 供 profile
# 即激活）：协议 openai-responses（用户实测可会话），密钥按 credential-ref
# 每请求从 credential store 解析 MODELS_API_KEY，models 预置网关目录全量。
- id: llm-pi-ai
  config:
    providers:
      yootun:
        displayName: Yootun
        apiKeyEnv: MODELS_API_KEY
        api: openai-responses
        baseURL: https://ixicai.cn/api/v1
        models:
          - { id: minimax-m2 }
          - { id: minimax-m2.1-highspeed }
          - { id: minimax-m2.1 }
          - { id: minimax-m2.5-highspeed }
          - { id: minimax-m2.5 }
          - { id: minimax-m2.7-highspeed }
          - { id: minimax-m2.7 }
          - { id: minimax-m3 }
          - { id: minimax-m3.1-flash }
          - { id: glm-5.3-flash }
          - { id: glm-5.3 }
          - { id: glm-5.2 }
          - { id: deepseek-v4-flash-vision }
          - { id: deepseek-v4-pro }
          - { id: deepseek-v4-flash }
          - { id: kimi-k3 }
          - { id: seed-2.0-lite }
          - { id: seed-2.0-mini }
          - { id: seed-2.0-pro }
          - { id: seed-2.0-code }
          - { id: seed-2.1-pro }
          - { id: seed-2.1-turbo }
          - { id: seed-evolving }

- id: agent-default-model
  config:
    provider: yootun
    model: deepseek-v4-flash

# 决策点 10（2026-11-13 定案）：ui-settings-models 保持官方默认（开放），用户
# 可自配 DeepSeek 官方 key/通道；yootun 激活强制不变，两者互不替代、互不解锁。
# 显式列出以声明这是有意为之的零动作（而非遗漏）。
# - id: ui-settings-models
#   （无 patch 行：官方 web-app 的 insert 原样生效）

- insert:
    - id: yootun-ui-brand
      name: '@yootun/dsh-client-ui-brand'
    # 企业接入层（分册 03 A 部分）：host 半暴露 yootun-access 设置 namespace
    # 与同源激活 API 路由，client 半挂全屏门禁与设置页区块。
    - id: yootun-access
      name: '@yootun/dsh-client-ui-access'

# managed MCP patch 格式定稿（分册 03 D 部分）。本批不注册真实路由；真实
# 路由随插件勾选清单在后续批次逐条补入本文件（客户端侧清单单一来源）。
# 凭证模板 ${credential:REF} 运行期经 credentials 服务解析并在诊断中脱敏
# （expandTemplates: true），凭证轮换无需重建插件实例。serverName 保持短名
# （<32 字符），规避旧桌面 64 字符工具名截断问题。
# 会话权限边界 = 挂载清单（分册 03 E 部分）：未激活不挂任何 MCP；挂载即模型
# 可见，「会话只读」策略落地时写/采集类路由不进本文件或经服务端 mcp-gateway
# 裁剪 tools/list（服务端改造另立项）。插件页面全能力通道由各业务插件的
# ctx.webServer.register 同源路由承载（随插件批次迁移）。
#
# - insert:
#     - id: mcp-yootun-<route>
#       name: '@deepseek-ai/dsh-mcp-client'
#       config:
#         transport: streamable-http
#         serverName: <32 字符内短名>
#         url: https://ixicai.cn/mcp/<route>
#         expandTemplates: true
#         headers:
#           Authorization: ${credential:MODELS_API_KEY}
#           X-Company-Code: yootun
