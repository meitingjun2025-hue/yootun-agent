# yootun 产品 bundle 的 patch 层：关闭官方品牌包、插入 yootun 品牌前端与
# 企业接入层、收口企业模型路由。本 bundle 在 profile bundles 列表中排在
# web-app 之后，patch 同 id 后层胜出：第一行覆盖 web-app 对 ui-brand-official
# 的 insert（官方品牌不加载）。
# managed MCP 的真实路由清单也收敛在本文件（分册 03 D 部分，见文末样例）。

- id: ui-brand-official
  disabled: true

# 企业模型路由（分册 03 B 部分，2026-11-14 协议定案 OpenAI Responses）：
# ixicai.cn 网关只服务 OpenAI 兼容协议（/v1/messages 不存在、
# /v1/chat/completions 真实 key 实测可对话），Anthropic 形态的 llm-deepseek
# 不适用（patch 收口撤除，恢复 base 官方默认；官方通道自配仍走官方默认
# 机制，决策点 10）。企业网关改经官方多协议适配器 llm-pi-ai 预置
# provider 路由（base bundle 已挂载 dormant，settings section 供 profile
# 即激活）：协议 openai-responses（用户实测可会话），密钥按 credential-ref
# 每请求从 credential store 解析 MODELS_API_KEY，models 预置网关目录全量。
- id: llm-pi-ai
  config:
    providers:
      yootun:
        displayName: Yootun
        apiKeyEnv: MODELS_API_KEY
        api: openai-responses
        baseURL: https://ixicai.cn/api/v1
        models:
          - { id: minimax-m2 }
          - { id: minimax-m2.1-highspeed }
          - { id: minimax-m2.1 }
          - { id: minimax-m2.5-highspeed }
          - { id: minimax-m2.5 }
          - { id: minimax-m2.7-highspeed }
          - { id: minimax-m2.7 }
          - { id: minimax-m3 }
          - { id: minimax-m3.1-flash }
          - { id: glm-5.3-flash }
          - { id: glm-5.3 }
          - { id: glm-5.2 }
          - { id: deepseek-v4-flash-vision }
          - { id: deepseek-v4-pro }
          - { id: deepseek-v4-flash }
          - { id: kimi-k3 }
          - { id: seed-2.0-lite }
          - { id: seed-2.0-mini }
          - { id: seed-2.0-pro }
          - { id: seed-2.0-code }
          - { id: seed-2.1-pro }
          - { id: seed-2.1-turbo }
          - { id: seed-evolving }

- id: agent-default-model
  config:
    provider: yootun
    model: deepseek-v4-flash

# 决策点 10（2026-11-13 定案）：ui-settings-models 保持官方默认（开放），用户
# 可自配 DeepSeek 官方 key/通道；yootun 激活强制不变，两者互不替代、互不解锁。
# 显式列出以声明这是有意为之的零动作（而非遗漏）。
# - id: ui-settings-models
#   （无 patch 行：官方 web-app 的 insert 原样生效）

- insert:
    - id: yootun-ui-brand
      name: '@yootun/dsh-client-ui-brand'
    # 企业接入层（分册 03 A 部分）：host 半暴露 yootun-access 设置 namespace
    # 与同源激活 API 路由，client 半挂全屏门禁与设置页区块。
    - id: yootun-access
      name: '@yootun/dsh-client-ui-access'
    # P1 桌面共用基础设施（分册 08 §4/§5/§6，2026-11-16）：Agent 面管理 MCP
    # （未激活零连接）、Workbench 私有连接器（不注册 ctx.tools）、媒体上传。
    # 三个业务工作台插件随 P2–P4 批次再插入；Catalog 面默认不挂载。
    - id: yootun-managed-mcp
      name: '@yootun/dsh-managed-mcp'
    - id: yootun-workbench-mcp
      name: '@yootun/dsh-workbench-mcp'
    - id: yootun-media-upload
      name: '@yootun/dsh-media-upload'

# Agent 面 MCP 的挂载自 P1 起由 `@yootun/dsh-managed-mcp` 承载（分册 08 §4）：
# 插件按激活门禁动态挂载官方 dsh-mcp-client（yootun-agent），未激活零连接；
# transport headers 固定为 Authorization: ${credential:MODELS_API_KEY} 与
# X-Company-Code: yootun（expandTemplates 展开、诊断脱敏），key 轮换由插件
# 销毁重建。本 patch 不再直接插入 mcp-client 路由条目；会话权限边界由该
# 插件的 tools/pre-execute guard 约束（读允许、任务写 ask、未识别 deny）。
# 插件页面全能力通道由各业务插件的 ctx.webServer.register 同源路由承载
# （随插件批次迁移）。
