# yootun 自有桌面打包 workflow（批次 2 建立构建链，批次 3 起出 yootun 品牌包）。
# 独立命名，不修改任何官方 workflow；官方 self-hosted 打包流水线（preset/签名/公证/COS）
# 不复用，仅调用官方 npm scripts 的 unsigned 自包含链路：打包入口内部编排
# build --profile local → 本地依赖闭包 → runtime 物化 → electron-builder → 产物冒烟。
# 品牌环境经 yootun/scripts/brand-environment.mjs 注入（官方脚本「品牌值 ?? 官方缺省」）；
# 未注入时（如批次 2 的历史运行）出未品牌化官方包。
# 构建时长实测数据回填 yootun/docs/1110/04-release.md 附录（2026-11-13 批次 2）。

name: Yootun Desktop Package

on:
  workflow_dispatch:
    # 可选版本号抬升（DSH_DESKTOP_BUILD_VERSION，官方键）：仅用于更新链真机验证——
    # feed 包版本须大于已装版本才会触发更新；tag 触发的正式发版不带此输入，
    # 包版本一律取 workspace 版本（分册 04 第 5 节官方恒等原则）。
    inputs:
      build_version:
        # 可选版本号抬升（仅 dispatch 验证用）：合法形态为产品版本的 build 扩展
        # （官方 validateDesktopBuildVersion 校验 `<workspace 版本>.<日期>.<序列>`，
        # 如 0.2.2-rc.2.20261114.1）；经 CLI --build-version 转发（打包入口唯一
        # 消费通道）。tag 触发的正式发版不带此输入，包版本一律取 workspace 版本。
        description: 'Build version extension for update-chain verification only, e.g. 0.2.2-rc.2.20261114.1'
        required: false
        type: string
  push:
    tags: ['yootun-v*']

permissions:
  contents: read

concurrency:
  group: yootun-desktop-package
  cancel-in-progress: false

jobs:
  package:
    strategy:
      # 探路批次：一个平台失败不影响另一平台跑完，各自留下完整日志与时长数据。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-script: package:desktop:win:x64:unsigned
            target-dir: win-x64
            artifact-name: yootun-desktop-windows-unsigned
          - os: macos-latest
            target-script: package:desktop:mac:arm64:unsigned
            target-dir: mac-arm64
            artifact-name: yootun-desktop-macos-unsigned
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Inject brand environment
        # 品牌环境单一出口（yootun/scripts/brand-environment.mjs 读 yootun/brand/brand.json）；
        # 官方脚本按「品牌环境值 ?? 官方缺省」消费，未注入时官方身份原样。
        # 注入必须在构建之前：client 构建键集（DSH_CLIENT_TAGLINE_*，首页空态标语）在
        # build:artifacts 的 bundle define 内联。shell 固定 bash：Windows runner 默认 pwsh
        # 的 >> 重定向行为与 bash 不同。
        shell: bash
        run: node yootun/scripts/brand-environment.mjs >> "$GITHUB_ENV"
      - name: Assert client brand environment
        # client 产物文案（onboarding 品牌名、首页空态标语）依赖构建期 DSH_CLIENT_*
        # （官方 define 按 DSH_CLIENT_ 前缀透传）；缺失会静默出官方文案的假品牌包，
        # 这里先 fail loud 暴露注入/传递断点。
        shell: bash
        run: |
          for key in DSH_CLIENT_PRODUCT_NAME DSH_CLIENT_TAGLINE_ZH DSH_CLIENT_TAGLINE_EN; do
            if [ -z "${!key}" ]; then
              echo "::error::client brand env missing: $key is empty"
              exit 1
            fi
          done
          echo "client brand env present: DSH_CLIENT_PRODUCT_NAME=${DSH_CLIENT_PRODUCT_NAME} DSH_CLIENT_TAGLINE_ZH=${DSH_CLIENT_TAGLINE_ZH}"
      - name: Build official artifacts
        # yootun 包的 tsc 引用官方包的 lib/types 产物（官方根 tsconfig 的 include 不含
        # yootun/**，官方构建不产出 yootun 包）；先跑官方 artifacts 链复现本地成功序列。
        # 打包入口内部的 complete build 随后走 tsc 增量，无全量翻倍。
        run: pnpm run build:artifacts
      - name: Build yootun packages
        # 打包闭包（ROOT_PACKAGES 含 @yootun/dsh-bundle-yootun）要求 lib/ 产物已就位。
        run: pnpm --filter '@yootun/*' run build
      - name: Write Windows packaging settings
        # unsigned 打包同样要求平台 dotenv（.env.windows 由本步骤生成，仓库内只有模板）。
        # 三个键即官方 unsigned 校验的最小集：品牌 appId + production 策略 origin
        # （mandatory-update origin 对 unsigned 与预打包构建同样必填）；上传凭证不被读取。
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:YOOTUN_BRAND_APP_ID) { throw 'brand environment missing: YOOTUN_BRAND_APP_ID is empty before writing .env.windows' }
          $settings = @"
          DSH_DESKTOP_APP_ID=$env:YOOTUN_BRAND_APP_ID
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://download.deepseek.com
          "@
          Set-Content -Path apps/desktop/.env.windows -Value $settings -Encoding utf8NoBOM
      - name: Validate packaging configuration and toolchain
        # 完整构建前的快速失败：环境校验 + 工具链探针（tar / Windows 下 VS C++ 探针）。
        # pnpm 会把 --check 直接转发给打包脚本（脚本参数解析不含分隔符转发问题）。
        run: pnpm run ${{ matrix.target-script }} --check
      - name: Package unsigned installer
        # 仅 dispatch 验证抬号时转发 --build-version（官方抬号通道是 CLI 参数）。
        # 判空必须用 truthiness：push tag 触发时 inputs.build_version 是 null，
        # `null != ''` 求值 true 会展开悬挂的空值参数（复审 P0）；null 与 ''
        # 均 falsy，两种空态都输出空串，包版本走 workspace 版本。
        # build_version 仅维护者可填（repo 内 dispatch），值再经官方
        # validateDesktopBuildVersion 校验后才进入版本号。
        run: pnpm run ${{ matrix.target-script }} ${{ inputs.build_version && format('--build-version {0}', inputs.build_version) || '' }}
      - name: Upload unsigned artifacts
        # 只上传分发物（安装器/更新包/差分文件/更新清单）；打包冒烟用的 win-unpacked 与
        # .app 解包目录不上传。批次 5 起品牌环境注入 feed origin：打包链为品牌 unsigned
        # 包生成 app-update.yml 与通道清单（latest.yml/latest-mac.yml，electron-builder
        # 成对生成零手工），artifact 供批次 5 操作表重命名后传 TOS feed。
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target-dir }}/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/${{ matrix.target-dir }}/unsigned-artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target-dir }}/unsigned-artifacts/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target-dir }}/unsigned-artifacts/*.blockmap
            apps/desktop/.desktop-build/targets/${{ matrix.target-dir }}/unsigned-artifacts/*.yml
          if-no-files-found: error
          retention-days: 14
